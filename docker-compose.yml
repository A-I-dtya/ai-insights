# ─── Insights AI — full stack with one command ───────────────────────
# Run with:  docker compose up
# Access:    http://localhost:5175  (frontend)
#            http://localhost:8000  (backend API)

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: insights-backend
    ports:
      - "8000:8000"
    environment:
      # GROQ_API_KEY is read from the .env file at the project root.
      - GROQ_API_KEY=${GROQ_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: insights-frontend
    ports:
      - "5175:5175"
    depends_on:
      - backend
    restart: unless-stopped
